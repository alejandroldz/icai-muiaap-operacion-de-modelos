[project]
name = "s7-http-rest-clients"
version = "0.1.0"
description = "Prácticas de HTTP, REST y cliente Wine Quality"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
